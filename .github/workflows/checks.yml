# ABOUTME: Runs the typecheck, lint, format and dead code checks on every pull request.
# ABOUTME: Route types are generated first because the code depends on them.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint and format
        run: npx biome ci --max-diagnostics=none .
      - name: Dead code
        run: npm run deadcode
